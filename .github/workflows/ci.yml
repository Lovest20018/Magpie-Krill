name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check source and plugin contract
        run: npm run check
      - name: Run synthetic service checks
        run: npm test
      - name: Check release contents
        run: node scripts/release-check.mjs
      - name: Pack local release
        run: npm pack --ignore-scripts
      - name: Retain package
        uses: actions/upload-artifact@v4
        with:
          name: krill-node${{ matrix.node }}-${{ matrix.os }}
          path: opencode-krill-usage-*.tgz
          if-no-files-found: error
