name: Sync release description

on:
  push:
    branches: [main]
    paths:
      - RELEASE.md
      - .github/workflows/release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-description
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the current release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = `v${version}`;
          const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const current = await fetch(`${api}/releases/tags/${encodeURIComponent(tag)}`, { headers });
          if (current.status === 404) {
            console.log(`No release for ${tag}; its description will be included when published.`);
            process.exit(0);
          }
          if (!current.ok) throw new Error(`Release lookup failed: HTTP ${current.status}`);
          const release = await current.json();
          assert.equal(release.tag_name, tag);
          const body = readFileSync('RELEASE.md', 'utf8');
          const response = await fetch(`${api}/releases/${release.id}`, {
            method: 'PATCH', headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({ body }),
          });
          if (!response.ok) throw new Error(`Release description update failed: HTTP ${response.status}`);
          const updated = await response.json();
          assert.equal(updated.body, body);
          console.log(`Updated ${tag}: ${updated.html_url}`);
          JS
